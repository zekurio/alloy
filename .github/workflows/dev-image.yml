name: dev image

run-name: "dev image ${{ github.sha }}"

# Only rebuild when inputs of the server image change; desktop, recorder,
# and docs-only merges do not affect it.
on:
  push:
    branches:
      - dev
    paths:
      - "packages/**"
      - "!packages/desktop/**"
      - "!packages/recorder/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/**"
      - ".github/workflows/dev-image.yml"
      - "!**/*.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish unstable image
    runs-on: ubuntu-latest

    steps:
      - name: checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The layered image tarball is rebuilt every merge and has no reuse
      # value; push only the package closure beneath it.
      - name: set up cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zekurio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "docker-image"

      - name: build image
        run: nix build .#dockerImage --print-build-logs --out-link result

      - name: load image
        run: docker load --input result

      - name: authenticate to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: push unstable image
        shell: bash
        run: |
          source_tag="$(nix eval --raw .#dockerImage.imageTag)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:unstable"
          docker tag "alloy:$source_tag" "$image"
          docker push "$image"
