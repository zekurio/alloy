name: checks

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Deliberately its own job: an advisory published upstream is not a defect
      # in the pull request, and must not mask fmt/lint/typecheck feedback.
      - name: Audit dependencies
        run: corepack pnpm audit

  checks:
    name: pnpm checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm fmt:check

      - name: Run lint
        run: corepack pnpm lint:github

      - name: Run typecheck
        run: corepack pnpm typecheck

      - name: Run tests
        run: corepack pnpm test

      - name: Build server and web
        run: corepack pnpm turbo run build --filter=@alloy/server --filter=@alloy/web

      - name: Check browser artifact
        run: |
          if grep -R -q "alloyDesktop" packages/web/dist; then
            echo "The server-hosted browser build contains native desktop integration."
            exit 1
          fi

      - name: Build bundled desktop renderer
        run: corepack pnpm --filter @alloy/desktop exec electron-vite build

      - name: Check bundled desktop artifact
        run: |
          test -f packages/desktop/out/renderer/desktop.html
          grep -q "Content-Security-Policy" packages/desktop/out/renderer/desktop.html
          grep -q "alloy-capture:" packages/desktop/out/renderer/desktop.html
          if grep -q "localhost:5273" packages/desktop/out/renderer/desktop.html; then
            echo "The packaged CSP contains the development websocket origin."
            exit 1
          fi
          grep -R -q "alloyDesktop" packages/desktop/out/renderer/assets
