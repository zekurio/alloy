name: checks

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Deliberately its own job: an advisory published upstream is not a defect
      # in the pull request, and must not mask fmt/lint/typecheck feedback.
      - name: audit dependencies
        run: corepack pnpm audit

  checks:
    name: pnpm checks
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: check formatting
        run: corepack pnpm fmt:check

      - name: run lint
        run: corepack pnpm lint:github

      - name: run typecheck
        run: corepack pnpm typecheck

      - name: run tests
        run: corepack pnpm test

      - name: build server and web
        run: corepack pnpm turbo run build --filter=@alloy/server --filter=@alloy/web

      - name: check browser artifact
        run: |
          grep -R -q "alloyDesktop" packages/web/dist

      - name: build desktop shell
        run: corepack pnpm --filter @alloy/desktop exec electron-vite build

      - name: check desktop shell artifact
        run: |
          test -f packages/desktop/out/renderer/index.html
          test ! -f packages/desktop/out/renderer/desktop.html
          grep -q "Content-Security-Policy" packages/desktop/out/renderer/index.html
          grep -q "alloyDesktop" packages/desktop/out/preload/main.cjs
          grep -q "alloy-server-origin" packages/desktop/out/preload/main.cjs
