name: tauri desktop

on:
  pull_request:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/contracts/**"
      - "packages/ui/**"
      - "packages/i18n/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-tauri.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: build and check windows desktop
    # The weekly cron exists for the rustsec audit; skip the 2x-billed
    # Windows job there since code did not change.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build connection screen
        run: pnpm --filter @alloy/desktop build:renderer

      - name: cache native runtimes
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            packages/desktop/resources/obs-runtime
            packages/desktop/.cache/ffmpeg
          key: windows-native-obs-32.1.2-ffmpeg-8.1.2-v2

      - name: stage obs runtime
        run: pnpm --filter @alloy/desktop obs:install --version 32.1.2

      - name: stage recorder and media tools
        run: node packages/desktop/scripts/prepare-native.mjs --release

      # One workspace-wide pass: every crate shares the dependency graph, so
      # clippy and the tests compile each dependency once.
      - name: check rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test rust workspace
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/packages/desktop/resources/ffmpeg;$env:PATH"
          cargo test --workspace --all-targets --locked
          exit $LASTEXITCODE

      - name: build unsigned installer
        run: pnpm tauri:dist:win:installer

      - name: upload test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alloy-tauri-windows-x64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
