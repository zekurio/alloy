name: desktop

# Windows desktop CI: the native host and addon, the recorder, and the
# Electron installer. JavaScript and TypeScript, including the shell, is
# formatted, linted, and typechecked by `checks` on ubuntu (no JS tests exist
# yet), so shared TS packages and docs do not start a Windows run. Files
# outside packages/desktop that the Rust tests or the installer build read
# directly must be listed below.
on:
  pull_request:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # `tests/connection.rs` embeds this fixture; the installer ships the logo.
      - "packages/contracts/fixtures/**"
      - "public/logo.png"
      # The installer bundles the shell, which these packages build into.
      - "packages/desktop-contracts/**"
      - "packages/i18n/**"
      - "packages/primitives/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
      - "!**/*.md"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: install cargo audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # Report in CI on every trigger, without creating issues or separate checks.
      # Vulnerabilities fail the job; informational advisories remain warnings.
      - name: audit dependencies
        run: cargo audit --file Cargo.lock

  # Lint and test are split from packaging: the two jobs compile different
  # profiles, and a lint failure should not wait behind the release link and
  # the NSIS installer. The weekly cron exists for the rustsec audit; both
  # Windows jobs skip it since code did not change.
  rust:
    name: check rust workspace
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Keyed by compiled profile, not by job: the two Windows jobs save
      # different artifacts and would race for one entry, dropping whichever
      # profile lost. A pull request restores only caches saved on `dev` or on
      # its own merge ref, so this debug cache is what its later runs reuse.
      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          shared-key: desktop-check

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # The staging scripts pin OBS and FFmpeg and decide what lands in the
      # runtime folder, so their hash keys the cache.
      - name: cache native runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/desktop/resources/obs-runtime
            packages/desktop/.cache/ffmpeg
          key: windows-native-${{ hashFiles('packages/desktop/scripts/*.mjs') }}

      # Builds the recorder and stages the FFmpeg the tests run against.
      - name: stage recorder and media tools
        run: node packages/desktop/scripts/prepare-native.mjs

      # One workspace-wide pass: every crate shares the dependency graph, so
      # clippy and the tests compile each dependency once.
      - name: check rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test rust workspace
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/packages/desktop/resources/ffmpeg;$env:PATH"
          cargo test --workspace --all-targets --locked
          exit $LASTEXITCODE

  installer:
    name: build windows installer
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      # Same key as the release job in publish.yml: both build the release
      # profile, and a cache saved on `dev` is the one a pull request restores.
      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          shared-key: desktop

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # The staging scripts pin OBS and FFmpeg and decide what lands in the
      # runtime folder, so their hash keys the cache.
      - name: cache native runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/desktop/resources/obs-runtime
            packages/desktop/.cache/ffmpeg
          key: windows-native-${{ hashFiles('packages/desktop/scripts/*.mjs') }}

      - name: stage obs runtime
        run: pnpm --filter @alloy/desktop obs:install

      # `dist:win:installer` stages the recorder, FFmpeg, and the addon itself
      # before it packages, so this job repeats none of the staging steps.
      # Without the release key the build has automatic updates off.
      - name: build unsigned installer
        run: pnpm desktop:dist:win:installer

      - name: upload test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alloy-desktop-windows-x64-${{ github.sha }}
          path: packages/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
