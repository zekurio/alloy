name: nix desktop

# Builds `.#alloy-desktop` on every pull request, unless Cachix already has
# its output path. Nix derives that path from every input of the package, and
# a same-repository run pushes it once built, so a pull request that leaves
# the package as it was spends its time on evaluation only. A plain
# `nix build` of a cached package would download its closure, over a
# gigabyte, without building anything.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-desktop:
    name: nix desktop package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Read-only on fork PRs (no secret); pushes from same-repo runs.
      - name: set up cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zekurio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: build desktop package
        run: |
          out="$(nix eval --raw .#alloy-desktop.outPath)"
          if nix path-info --store https://zekurio.cachix.org "$out" >/dev/null 2>&1; then
            echo "Cachix already has $out."
          else
            nix build .#alloy-desktop --print-build-logs
          fi
