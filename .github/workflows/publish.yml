name: publish

run-name: "release ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version override (optional, e.g. 1.2.3)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: check formatting
        run: corepack pnpm fmt:check

      - name: run lint
        run: corepack pnpm lint:github

      - name: run typecheck
        run: corepack pnpm typecheck

      # Only names the release commit's author. The push below still uses
      # github.token, so it doesn't trigger the push workflows on dev. The
      # checkout does not persist that token; the push passes it explicitly.
      - name: mint alloy-gardener token
        id: app
        if: vars.GARDENER_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GARDENER_CLIENT_ID }}
          private-key: ${{ secrets.GARDENER_PRIVATE_KEY }}
          permission-contents: read

      - id: release
        name: resolve version, commit, and tag
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # JavaScript template expressions must remain literal for node -e.
          # shellcheck disable=SC2016
          current="$(node -e '
            const { readFileSync } = require("node:fs");
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(String(version))) {
              console.error(`Invalid package.json version: ${version}`);
              process.exit(1);
            }
            console.log(version);
          ')"

          release_published() {
            gh release view "$1" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null |
              grep -qx "published"
          }

          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version override must be plain semver, got: $INPUT_VERSION" >&2
              exit 1
            fi
            version="$INPUT_VERSION"
          elif ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            # The checked-in version was bumped but never tagged: a previous
            # run failed after its release commit. Release the pending version
            # instead of bumping again.
            echo "Recovering untagged version $current."
            version="$current"
          elif ! release_published "v$current"; then
            # The tag exists but the release never published: a previous run
            # failed after tagging. Finish that release instead of bumping.
            echo "Recovering unpublished release v$current."
            version="$current"
          else
            # shellcheck disable=SC2016
            version="$(CURRENT="$current" BUMP="$INPUT_BUMP" node -e '
              const [major, minor, patch] = process.env.CURRENT.split(".").map(Number);
              const bump = process.env.BUMP || "patch";
              if (bump === "major") console.log(`${major + 1}.0.0`);
              else if (bump === "minor") console.log(`${major}.${minor + 1}.0`);
              else console.log(`${major}.${minor}.${patch + 1}`);
            ')"
          fi

          tag="v$version"

          previous_tag="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -Fxv "$tag" |
              head -n 1 || true
          )"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if release_published "$tag"; then
              echo "Release $tag is already published." >&2
              exit 1
            fi
            # Rebuild the pending release from the exact tagged commit.
            ref="$(git rev-list -n 1 "$tag")"
          else
            if [[ -n "$APP_SLUG" ]]; then
              bot="${APP_SLUG}[bot]"
              bot_id="$(gh api "users/$bot" --jq .id)"
            else
              bot="github-actions[bot]"
              bot_id=41898282
            fi
            git config user.name "$bot"
            git config user.email "$bot_id+$bot@users.noreply.github.com"

            if [[ "$version" != "$current" ]]; then
              node scripts/update-release-package-versions.mjs "$version"
              git add package.json \
                Cargo.lock \
                packages/desktop/package.json \
                packages/desktop/host/Cargo.toml \
                packages/desktop/native/Cargo.toml \
                packages/desktop/recorder/Cargo.toml
              git commit -m "chore: release $tag"
            fi

            git tag "$tag"
            # The checkout dropped its credentials, so authenticate this push
            # with the job token (masked in logs) instead of the remote.
            git push --atomic "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" dev "refs/tags/$tag"
            ref="$(git rev-parse HEAD)"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: build windows desktop release
    needs: [preflight]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.ref }}

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          # Same key as the installer job in desktop.yml: a cache saved on `dev`
          # is the only one a pull request can restore, so this release build
          # is what keeps desktop CI from recompiling from scratch.
          shared-key: desktop

      # The staging scripts pin OBS and FFmpeg and decide what lands in the
      # runtime folder, so their hash keys the cache.
      - name: cache native runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/desktop/resources/obs-runtime
            packages/desktop/.cache/ffmpeg
          key: windows-native-${{ hashFiles('packages/desktop/scripts/*.mjs') }}

      - name: stage obs runtime
        run: corepack pnpm --filter @alloy/desktop obs:install

      # The public key is compiled into the app, which checks every update
      # against it. Without it the build would ship with updates off.
      - name: build desktop installer
        env:
          NODE_ENV: production
          ALLOY_UPDATER_PUBLIC_KEY: ${{ vars.ALLOY_UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!$env:ALLOY_UPDATER_PUBLIC_KEY) {
            throw "Configure ALLOY_UPDATER_PUBLIC_KEY before a release."
          }
          corepack pnpm desktop:dist:win:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signs with the minisign key pair the Tauri updater trusted, so the
      # same signature serves this app's updater and the Tauri builds that
      # update to it. `tauri signer` writes `<installer>.sig`; the CLI is only
      # fetched here, not a dependency.
      - name: sign desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Configure the update signing key before a release."
          }
          corepack pnpm dlx @tauri-apps/cli@2.12.3 signer sign "packages/desktop/release/Alloy-Desktop-$env:RELEASE_VERSION-win-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: prepare desktop release assets
        run: node scripts/prepare-desktop-release.mjs ${{ needs.preflight.outputs.version }}

      - name: upload desktop release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-assets
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.exe.blockmap
            packages/desktop/release/*.sig
            packages/desktop/release/latest.yml
            packages/desktop/release/latest.json
          if-no-files-found: error

  image:
    name: publish container image
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.ref }}

      - name: install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build and load container image
        run: |
          nix build .#dockerImage --out-link docker-image
          docker load --input docker-image

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: tag and push container image
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "alloy:$RELEASE_VERSION" "$image:$RELEASE_VERSION"
          docker push "$image:$RELEASE_VERSION"

  publish:
    name: publish github release
    needs:
      - preflight
      - desktop
      - image
      - promote
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.ref }}

      - name: download desktop release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-assets
          path: release-assets

      - name: generate release checksums
        shell: bash
        run: |
          tmp="$(mktemp)"
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%P\n' | sort | while IFS= read -r file; do
              sha256sum "$file"
            done
          ) > "$tmp"
          mv "$tmp" release-assets/checksums.txt
          cat release-assets/checksums.txt

      - name: write release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REF: ${{ needs.preflight.outputs.ref }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        with:
          script: |
            const { writeReleaseNotes } = require("./scripts/write-release-notes.cjs")

            await writeReleaseNotes({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
              ref: process.env.RELEASE_REF,
              previousTag: process.env.PREVIOUS_TAG,
            })

      # Publish as the alloy-gardener GitHub App when it is configured; it needs
      # Contents read/write. Otherwise fall back to github-actions[bot].
      - name: mint alloy-gardener token
        id: app
        if: vars.GARDENER_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GARDENER_CLIENT_ID }}
          private-key: ${{ secrets.GARDENER_PRIVATE_KEY }}
          permission-contents: write

      - name: publish github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/*.sig
            release-assets/latest.yml
            release-assets/latest.json
            release-assets/checksums.txt
          fail_on_unmatched_files: true

  promote:
    name: promote latest container image
    needs:
      - preflight
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: promote immutable image to latest
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" \
            "$image:$RELEASE_VERSION"
