name: windows installer

# Builds the Windows NSIS installer and uploads it, with its blockmap and
# `latest.yml`, as the `desktop-installer` artifact. desktop.yml calls it for
# the test installer on pull requests, and publish.yml for the release, which
# its `sign` job then signs. Both build the release profile and so share one
# cargo cache: a cache saved on `dev` is the only one a pull request can
# restore, so the release build is what keeps desktop CI from recompiling from
# scratch.
on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build. Empty builds the caller's commit."
        type: string
        default: ""
      updater-public-key:
        description: "The update keys compiled into the app. Empty turns updates off."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  installer:
    name: build installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          shared-key: desktop

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # The staging scripts pin OBS and FFmpeg and decide what lands in the
      # runtime folder, so their hash keys the cache. The addon script does
      # not touch these folders.
      - name: cache native runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/desktop/resources/obs-runtime
            packages/desktop/.cache/ffmpeg
          key: windows-native-${{ hashFiles('packages/desktop/scripts/archive.mjs', 'packages/desktop/scripts/build-agent.mjs', 'packages/desktop/scripts/install-obs-runtime.mjs', 'packages/desktop/scripts/obs-runtime.mjs', 'packages/desktop/scripts/prepare-native.mjs') }}

      - name: stage obs runtime
        run: pnpm --filter @alloy/desktop obs:install

      # `dist:win:installer` stages the recorder, FFmpeg, and the addon itself
      # before it packages, so this job repeats none of the staging steps.
      - name: build installer
        env:
          ALLOY_UPDATER_PUBLIC_KEY: ${{ inputs.updater-public-key }}
        run: pnpm desktop:dist:win:installer

      # Electron brings no Visual C++ runtime, so the addon must not import
      # one: a machine without the redistributable could not start Alloy.
      - name: check the addon needs no Visual C++ runtime
        shell: pwsh
        run: |
          $addon = "packages/desktop/resources/native/alloy-desktop.node"
          if (Select-String -Path $addon -Pattern "VCRUNTIME140" -SimpleMatch -Quiet) {
            throw "The desktop addon imports the Visual C++ runtime."
          }

      - name: upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installer
          path: |
            packages/desktop/release/*-setup.exe
            packages/desktop/release/*-setup.exe.blockmap
            packages/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14
