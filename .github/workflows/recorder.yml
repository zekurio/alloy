name: recorder

on:
  pull_request:
    branches:
      - dev
    paths:
      - "packages/recorder/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/recorder.yml"
  push:
    branches:
      - dev
    paths:
      - "packages/recorder/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/recorder.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: cargo checks
    # The weekly cron exists for the rustsec audit; skip the 2x-billed
    # Windows job there since code did not change.
    if: github.event_name != 'schedule'
    runs-on: windows-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - name: check formatting
        run: cargo fmt --package alloy-agent --check

      - name: run clippy
        run: cargo clippy --package alloy-agent --all-targets --locked -- -D warnings
