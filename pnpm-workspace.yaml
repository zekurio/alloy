packages:
  - "packages/*"

catalog:
  vite: 8.3.4

allowBuilds:
  esbuild: true
  # Native image decoding for server-side BlurHash computation (game art).
  sharp: true
  # Squirrel.Windows support pulled in by electron-builder. The desktop app
  # ships an NSIS installer, so its install script is never needed.
  electron-winstaller: false

overrides:
  # Upstream packages have not yet refreshed these transitive patch releases.
  "@xmldom/xmldom": 0.8.15
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  esbuild: 0.28.1
  fast-uri: 3.1.9
  form-data: 4.0.6
  js-yaml: 4.3.2
  # GHSA-97r2-qh9m-474h, GHSA-wp97-x4hv-qvhp, GHSA-7rv5-mrxv-xcr9,
  # GHSA-f86p-h4j2-7qgj, GHSA-9wx9-5pv9-3349 (via @tanstack/router-core).
  seroval: 1.6.12
  seroval-plugins: 1.6.12
  # GHSA-r292-9mhp-454m (uncatchable stack overflow on crafted long paths).
  tar: 7.5.21
  undici: 7.30.1
  vite: "catalog:"

auditConfig:
  ignoreGhsas:
    # minimatch glob-pattern DoS, fixed only in 11.0.1. It reaches the tree
    # through build tooling (electron-builder and friends) on the 3/5/9/10
    # majors, never production code, and none of it takes untrusted patterns.
    # Drop this once those packages ship patched releases.
    - GHSA-g3hv-75wg-m249
