packages:
  - "packages/*"

catalog:
  vite: 8.3.0
  vitest: 5.0.1

allowBuilds:
  esbuild: true
  # Native image decoding for server-side BlurHash computation (game art).
  sharp: true

minimumReleaseAgeExclude:
  - hono@4.13.0
  - zod@4.6.4

overrides:
  # Upstream packages have not yet refreshed these transitive patch releases.
  "@xmldom/xmldom": 0.8.15
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.6
  form-data: 4.0.6
  js-yaml: 4.3.2
  # GHSA-r292-9mhp-454m (uncatchable stack overflow on crafted long paths).
  tar: 7.5.21
  undici: 7.29.0
  vite: "catalog:"
  vitest: "catalog:"
