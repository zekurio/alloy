packages:
  - "packages/*"

allowBuilds:
  # Download Electron only when the macOS/Windows desktop app is run, keeping
  # server installs and CI free of the large platform binary.
  electron: false
  # electron-builder pulls this in for Squirrel.Windows support. Alloy's first
  # Windows target is NSIS, so keep this transitive build script disabled.
  electron-winstaller: false
  esbuild: true
  # Native image decoding for server-side BlurHash computation (game art).
  sharp: true

auditConfig:
  ignoreGhsas:
    # brace-expansion DoS via unbounded expansion. Unfixable here rather than
    # unfixed: the advisory marks everything <=5.0.7 vulnerable, so the 1.x and
    # 2.x lines electron-builder pulls in through minimatch@3/@5/@9 have no
    # patched release at all. The only fixed build, 5.0.8, exports `expand` as
    # a named CJS binding, while minimatch@3 does `require(...)` expecting the
    # function itself and minimatch@9 reads `.default` - forcing it tree-wide
    # breaks asar packing, and only on Windows, where desktop packaging runs.
    # electron-builder is already at its latest release (26.15.3).
    # Exposure is limited to build time with in-repo glob patterns; nothing
    # here expands attacker-controlled braces. Revisit when electron-builder
    # moves off minimatch@3.
    - GHSA-mh99-v99m-4gvg

overrides:
  # The one brace-expansion line with a compatible fix: minimatch@10 targets
  # the 5.x API, so it can take the patched build the older chains cannot.
  brace-expansion@5: 5.0.8
  esbuild: 0.28.1
  fast-uri: 3.1.4
  form-data: 4.0.6
  # GHSA-r292-9mhp-454m (uncatchable stack overflow on crafted long paths).
  tar: 7.5.21
  undici: 7.28.0
