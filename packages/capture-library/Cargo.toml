[package]
name = "alloy-capture-library"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = { workspace = true }
futures-util = "0.3"
http = "1"
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = "2"
time = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
trash = "5"
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
