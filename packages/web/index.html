<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script nonce="__ALLOY_CSP_NONCE__">
      // Set the theme class before paint to avoid a flash. Mirrors
      // @alloy/ui/lib/theme; keep the storage key in sync.
      try {
        var preferences = JSON.parse(
          localStorage.getItem("alloy.theme") || "null",
        )
        var theme =
          preferences &&
          (preferences.mode === "dark" ||
            preferences.mode === "light" ||
            preferences.mode === "system")
            ? preferences.mode
            : "system"
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch {
        try {
          document.documentElement.classList.add(
            matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light",
          )
        } catch {
          document.documentElement.classList.add("dark")
        }
      }
    </script>
    <style>
      /* Boot splash, painted before the app bundle runs. Theme tokens load
         with the stylesheet; the fallbacks cover the moment before it. */
      :root {
        --boot-background: oklch(0.11 0 0);
        --boot-track: oklch(1 0 0 / 0.08);
      }
      :root.light {
        --boot-background: oklch(0.99 0 0);
        --boot-track: oklch(0 0 0 / 0.08);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--background, var(--boot-background));
        transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-splash[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        opacity: 0;
        /* Held back briefly so fast loads never flash the logo. */
        animation: boot-splash-in 280ms cubic-bezier(0.16, 1, 0.3, 1) 150ms
          forwards;
      }
      #boot-splash img {
        display: block;
        width: 56px;
        height: 56px;
        user-select: none;
        animation: boot-splash-breathe 2.4s ease-in-out infinite;
      }
      #boot-splash span {
        position: relative;
        width: 88px;
        height: 2px;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--boot-track);
      }
      #boot-splash span::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--accent, #d0c4eb);
        animation: boot-splash-progress 1.2s cubic-bezier(0.65, 0, 0.35, 1)
          infinite;
      }
      @keyframes boot-splash-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-splash-breathe {
        50% {
          opacity: 0.72;
        }
      }
      @keyframes boot-splash-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash > div,
        #boot-splash img,
        #boot-splash span::after {
          transition: none;
          animation: none;
        }
        #boot-splash > div {
          opacity: 1;
        }
        #boot-splash span::after {
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
    <!-- alloy:head -->
    <title>alloy</title>
    <meta name="description" content="Share and watch game clips on alloy." />
    <meta property="og:site_name" content="alloy" />
    <meta property="og:title" content="alloy" />
    <meta
      property="og:description"
      content="Share and watch game clips on alloy."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="alloy" />
    <meta
      name="twitter:description"
      content="Share and watch game clips on alloy."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Removed by main.tsx once the first route has rendered. -->
    <div id="boot-splash" aria-hidden="true">
      <div>
        <img src="/logo.png" alt="" draggable="false" />
        <span></span>
      </div>
    </div>
    <!-- alloy:bootstrap -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
