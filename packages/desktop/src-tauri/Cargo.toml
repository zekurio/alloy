[package]
name = "alloy-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[features]
default = ["shell"]
shell = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:open",
  "dep:rfd",
  "dep:alloy-recording-host",
  "dep:alloy-capture-library",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-single-instance",
]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }
rustls = { workspace = true }

[dependencies]
alloy-recording-host = { path = "../../recording-host", optional = true }
alloy-capture-library = { path = "../../capture-library", optional = true }
rfd = { version = "0.16", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
base64 = { workspace = true }
open = { version = "5", optional = true }
rand = "0.9"
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
time = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = { workspace = true }

[[bin]]
name = "alloy-desktop"
path = "src/main.rs"
required-features = ["shell"]
