# The desktop host's native work. The Electron main process reaches it
# through the `alloy-desktop-native` addon.
[package]
name = "alloy-desktop"
version = "0.0.19"
edition = "2024"
publish = false

[dependencies]
alloy-agent = { path = "../recorder" }
axum = "0.8"
base64 = { workspace = true }
blurhash = "0.2"
fs2 = "0.4"
futures-util = "0.3"
http = "1"
log = { version = "0.4", features = ["std"] }
minisign-verify = "0.3"
rand = "0.10"
reqwest = { workspace = true, features = ["json", "stream"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = "2"
time = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
trash = "5"
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
