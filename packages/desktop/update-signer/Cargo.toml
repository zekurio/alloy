# Signs the desktop installer in the release workflow. It handles the private
# update key, so it is built from the lockfile instead of fetched at release
# time. Release tooling, never shipped, so it keeps its own version instead of
# the workspace's release version.
[package]
name = "alloy-update-signer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = { workspace = true }
minisign = "0.9"
