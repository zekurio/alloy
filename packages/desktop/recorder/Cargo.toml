[package]
name = "alloy-agent"
version = "0.0.8"
edition = "2021"
publish = false

# The crate is both a library the desktop host links against and the sidecar
# binary the host spawns. The binary keeps the `alloy-agent` name the host looks
# for on disk; the library is `alloy_recorder`.
[lib]
name = "alloy_recorder"
path = "src/lib.rs"

[[bin]]
name = "alloy-agent"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
libloading = "0.9"
rodio = "0.22.2"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
