[package]
name = "alloy-recording-host"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
